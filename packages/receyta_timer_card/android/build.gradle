plugins {
    id "com.android.library"
    id "kotlin-android"
}

group = "com.whisklinestudio.timer_card"
version = "1.0"

android {
    namespace = "com.whisklinestudio.timer_card"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    defaultConfig {
        minSdk = 21
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
}
